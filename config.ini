
# CrowdStrike - Zscaler Intel Bridge Configuration File
# Enter values prior to first launch

# CrowdStrike configurations
# Do not use quotation marks in these values!
[CROWDSTRIKE]
client=
secret=
base_url=https://api.crowdstrike.com
type=url
limit=10000

# ZScaler configurations
# Hostname only requires the base URL! (i.e. https://zsapi.zscalerthree.net)
[ZSCALER]
hostname=https://admin.zscaler.net
username=
password=
token=

#If running as a chron job, set this value to 1
#When disable_loop=1, the script will exit after completing a cycle
[CHRON]
disable_loop=0

#When log_indicators=1, indicators will be logged in logs/data_log as they are deleted and loaded.
[LOG]
log_indicators=0

# HTTP timeout and retry settings (optional; defaults are used if this section or a value is missing)
# connect_timeout: seconds allowed to establish a connection (must be greater than 0)
# read_timeout: seconds allowed to wait for a response (must be greater than 0)
# max_retries: retries after a connection error, timeout or URL lookup error (0 disables retrying)
# retry_backoff: seconds before the first retry; the wait doubles on each retry (30, 60, 120, ...)
[HTTP]
connect_timeout=10
read_timeout=120
max_retries=5
retry_backoff=30
